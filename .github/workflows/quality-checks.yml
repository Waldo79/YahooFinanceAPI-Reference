name: Quality Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile capture utility
        run: python -m py_compile tools/capture-utility/yahoo_capture.py

      - name: Run test suite
        run: python -m pytest -q --basetemp="${RUNNER_TEMP}/yahoo-finance-api-tests"
